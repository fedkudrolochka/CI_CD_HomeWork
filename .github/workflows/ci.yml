
name: Python CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Build application
        run: python -m py_compile umnichka.py

      - name: Run application
        run: python umnichka.py
