
name: Python CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Имя репозитория
        uses: actions/checkout@v4

      - name: Питон
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Установка пайтест
        run: python -m pip install pytest

      - name: проверка синтаксиса
        run: python -m py_compile umnichka.py

      - name: Запуск тестов
        run: python -m pytest test_student.py -v
